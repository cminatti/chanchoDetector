# gradle build config
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.jvmargs=-Xmx4608M

# use androidX
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=false

# disable resource validation
android.disableResourceValidation=true

# build config
ANDROID_MIN_SDK_VERSION=24
ANDROID_TARGET_SDK_VERSION=35
ANDROID_COMPILE_SDK_VERSION=35
KOTLIN_VERSION=2.1.0
NDK_VERSION=21.4.7075529

# msdk api key (Place real keys in local.properties)
AIRCRAFT_API_KEY=PLACEHOLDER
GMAP_API_KEY=PLACEHOLDER
MAPLIBRE_TOKEN=PLACEHOLDER

# signing info (Place real info in local.properties)
STORE_FILE=PLACEHOLDER
STORE_PASSWORD=PLACEHOLDER
KEY_ALIAS=PLACEHOLDER
KEY_PASSWORD=PLACEHOLDER

# maven
KOTLIN_MAVEN=https://dl.bintray.com/kotlin/kotlin-eap
REPO_MAVEN2=https://repo1.maven.org/maven2
JITPACK_MAVEN_URL=https://jitpack.io
